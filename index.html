<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores Diários Import Sebe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

  .app { display: flex; width: 100%; max-width: 1100px; height: 680px; border: 1px solid #e0ddd6; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }

  .sidebar { width: 220px; border-right: 1px solid #e0ddd6; display: flex; flex-direction: column; background: #faf9f7; flex-shrink: 0; }
  .sb-head { padding: 20px 16px 14px; border-bottom: 1px solid #e0ddd6; }
  .sb-head h1 { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .sb-head p { font-size: 11px; color: #888; margin-top: 3px; }
  .nav { flex: 1; padding: 10px 8px; }
  .ni { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #666; margin-bottom: 3px; transition: all 0.12s; user-select: none; }
  .ni:hover { background: #fff; color: #1a1a1a; }
  .ni.active { background: #fff; color: #1a1a1a; font-weight: 500; border: 1px solid #e0ddd6; }
  .nd { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .status-bar { padding: 10px 14px; border-top: 1px solid #e0ddd6; display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #1D9E75; flex-shrink: 0; }
  .status-dot.err { background: #D85A30; }
  .status-dot.loading { background: #BA7517; }
  #status-txt { font-size: 10px; color: #888; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { padding: 13px 20px; border-bottom: 1px solid #e0ddd6; display: flex; align-items: center; justify-content: space-between; background: #fff; }
  .topbar-title { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .topbar-date { font-size: 11px; color: #888; }
  .sync-btn { padding: 5px 12px; font-size: 11px; border: 1px solid #ddd; border-radius: 7px; background: none; cursor: pointer; color: #555; font-family: inherit; transition: all 0.12s; }
  .sync-btn:hover { background: #f5f5f3; }

  .content { flex: 1; overflow-y: auto; padding: 18px 20px; background: #f9f9f7; }
  .page { display: none; } .page.active { display: block; }

  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; gap: 12px; }
  .empty p { font-size: 13px; color: #888; line-height: 1.6; }
  .empty button { margin-top: 4px; padding: 8px 18px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .empty button:hover { opacity: 0.82; }

  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .mc { background: #fff; border: 1px solid #e0ddd6; border-radius: 10px; padding: 14px; }
  .mc-label { font-size: 10px; color: #888; display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
  .mc-val { font-size: 22px; font-weight: 600; color: #1a1a1a; }
  .mc-unit { font-size: 12px; font-weight: 400; color: #888; }
  .mc-sub { font-size: 10px; margin-top: 4px; }
  .up { color: #1D9E75; } .down { color: #D85A30; } .neu { color: #888; }

  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .cc { background: #fff; border: 1px solid #e0ddd6; border-radius: 12px; padding: 14px; }
  .cc-title { font-size: 11px; font-weight: 500; color: #888; margin-bottom: 10px; }

  .htable { background: #fff; border: 1px solid #e0ddd6; border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .th-head { padding: 10px 16px; font-size: 11px; font-weight: 500; color: #888; border-bottom: 1px solid #e0ddd6; display: flex; justify-content: space-between; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { padding: 8px 14px; text-align: left; color: #888; font-weight: 400; border-bottom: 1px solid #e0ddd6; white-space: nowrap; }
  td { padding: 8px 14px; color: #1a1a1a; border-bottom: 1px solid #f0ede8; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #faf9f7; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 500; }
  .b-ok { background: #E1F5EE; color: #0F6E56; }
  .b-warn { background: #FAEEDA; color: #854F0B; }
  .b-bad { background: #FAECE7; color: #993C1D; }
  .b-neu { background: #f0ede8; color: #666; }

  .fsec { background: #fff; border: 1px solid #e0ddd6; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .fsec-title { font-size: 12px; font-weight: 600; color: #1a1a1a; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #f0ede8; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fg { display: flex; flex-direction: column; gap: 5px; }
  .fg.full { grid-column: 1 / -1; }
  label { font-size: 11px; color: #666; font-weight: 500; }
  input, select, textarea { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #ddd; border-radius: 8px; background: #faf9f7; color: #1a1a1a; font-family: inherit; transition: border-color 0.12s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #999; background: #fff; }
  textarea { resize: vertical; min-height: 60px; }
  .ffoot { display: flex; justify-content: flex-end; margin-top: 14px; gap: 8px; }
  .btn-p { padding: 8px 18px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.12s; }
  .btn-p:hover { opacity: 0.82; }
  .btn-p:disabled { opacity: 0.4; cursor: not-allowed; }

  .il { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .ir { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #e0ddd6; border-radius: 10px; padding: 10px 14px; }
  .idot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .iname { flex: 1; font-size: 13px; color: #1a1a1a; font-weight: 500; }
  .iunit { font-size: 11px; color: #888; margin-right: 8px; }
  .btn-s { padding: 5px 11px; font-size: 11px; border: 1px solid #ddd; border-radius: 7px; background: none; cursor: pointer; color: #666; font-family: inherit; transition: all 0.12s; }
  .btn-s:hover { background: #f5f5f3; }
  .btn-s.del:hover { color: #D85A30; border-color: #D85A30; }

  .spinner { width: 14px; height: 14px; border: 2px solid #e0ddd6; border-top-color: #888; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { padding: 20px; font-size: 12px; color: #888; }

  .toast { display: none; position: fixed; bottom: 20px; right: 20px; padding: 10px 18px; border-radius: 9px; font-size: 13px; z-index: 999; font-family: inherit; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
  .toast.ok { background: #1D9E75; color: #fff; }
  .toast.err { background: #D85A30; color: #fff; }
  .toast.info { background: #1a1a1a; color: #fff; }

  .dot-ind { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  /* scrollbar */
  .content::-webkit-scrollbar { width: 5px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sb-head">
      <h1>Indicadores Diários Import Sebe</h1>
      <p id="sb-date"></p>
    </div>
    <nav class="nav">
      <div class="ni active" onclick="go('dashboard')"><div class="nd" style="background:#1D9E75"></div>Dashboard</div>
      <div class="ni" onclick="go('lancamento')"><div class="nd" style="background:#378ADD"></div>Lançar dados</div>
      <div class="ni" onclick="go('indicadores')"><div class="nd" style="background:#7F77DD"></div>Indicadores</div>
    </nav>
    <div class="status-bar">
      <div class="status-dot loading" id="status-dot"></div>
      <span id="status-txt">Conectando...</span>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="page-title">Dashboard</span>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date"></span>
        <button class="sync-btn" onclick="syncAll()">↻ Sincronizar</button>
      </div>
    </div>
    <div class="content">

      <!-- DASHBOARD -->
      <div class="page active" id="page-dashboard">
        <div id="dash-content"><div class="loading"><span class="spinner"></span>Carregando dados da planilha...</div></div>
      </div>

      <!-- LANÇAMENTO -->
      <div class="page" id="page-lancamento">
        <div class="fsec">
          <div class="fsec-title">Novo lançamento</div>
          <div class="fgrid">
            <div class="fg"><label>Data</label><input type="date" id="f-date"></div>
            <div class="fg"><label>Indicador</label><select id="f-ind"></select></div>
            <div class="fg"><label>Valor realizado</label><input type="number" id="f-val" placeholder="0" step="any"></div>
            <div class="fg"><label>Meta do dia <span style="color:#aaa;font-weight:400">(opcional)</span></label><input type="number" id="f-goal" placeholder="—" step="any"></div>
            <div class="fg full"><label>Observações</label><textarea id="f-notes" placeholder="Contexto, eventos relevantes..."></textarea></div>
          </div>
          <div class="ffoot"><button class="btn-p" id="btn-save" onclick="saveEntry()">Salvar lançamento</button></div>
        </div>
        <div class="htable">
          <div class="th-head"><span>Lançamentos recentes</span></div>
          <div id="entries-wrap"><div class="loading"><span class="spinner"></span>Carregando...</div></div>
        </div>
      </div>

      <!-- INDICADORES -->
      <div class="page" id="page-indicadores">
        <div class="il" id="ind-list"><div class="loading"><span class="spinner"></span>Carregando...</div></div>
        <div class="fsec">
          <div class="fsec-title">Adicionar novo indicador</div>
          <div class="fgrid">
            <div class="fg"><label>Nome</label><input type="text" id="i-name" placeholder="ex: Vendas, NPS, Chamados..."></div>
            <div class="fg"><label>Unidade</label><input type="text" id="i-unit" placeholder="ex: R$, %, un, min"></div>
            <div class="fg"><label>Sentido positivo</label>
              <select id="i-dir">
                <option value="up">Maior é melhor (↑)</option>
                <option value="down">Menor é melhor (↓)</option>
                <option value="none">Neutro</option>
              </select>
            </div>
            <div class="fg"><label>Cor</label>
              <select id="i-color">
                <option value="#1D9E75">Verde</option>
                <option value="#378ADD">Azul</option>
                <option value="#7F77DD">Roxo</option>
                <option value="#D85A30">Laranja</option>
                <option value="#D4537E">Rosa</option>
                <option value="#BA7517">Âmbar</option>
                <option value="#888780">Cinza</option>
              </select>
            </div>
          </div>
          <div class="ffoot"><button class="btn-p" id="btn-add-ind" onclick="addInd()">Adicionar indicador</button></div>
        </div>
      </div>

    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxt8tALES0j56z1BQZYozyc5MOX8rfjoeq2qCUc-FgmNhMG9dKqBxsv9JYBL-v6rlux1A/exec';

  let indicators = [];
  let entries    = [];
  let lineChart, barChart;

  function today() { return new Date().toISOString().split('T')[0]; }
  function fmtD(ds) { if (!ds) return '—'; const [y,m,d] = ds.split('-'); return `${d}/${m}/${y}`; }
  function last7() {
    const r = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); r.push(d.toISOString().split('T')[0]); }
    return r;
  }
  function fmtVal(v, unit) { return `${Number(v).toLocaleString('pt-BR')} ${unit || ''}`; }

  function setStatus(state, msg) {
    const dot = document.getElementById('status-dot');
    dot.className = 'status-dot' + (state === 'ok' ? '' : state === 'err' ? ' err' : ' loading');
    document.getElementById('status-txt').textContent = msg;
  }

  function showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast ${type}`; t.style.display = 'block';
    clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2800);
  }

  async function sheetsGet(sheetName) {
    const url = `${SCRIPT_URL}?sheet=${sheetName}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  async function sheetsAppend(sheetName, row) {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ sheet: sheetName, row })
    });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  async function loadIndicators() {
    const data = await sheetsGet('indicadores');
    const rows = data.values || [];
    indicators = rows.filter(r => r[0] && r[0] !== 'id').map(r => ({
      id: r[0], name: r[1] || '', unit: r[2] || 'un', dir: r[3] || 'none', color: r[4] || '#888780'
    }));
  }

  async function loadEntries() {
    const data = await sheetsGet('lancamentos');
    const rows = data.values || [];
    entries = rows.filter(r => r[0] && r[0] !== 'id').map(r => ({
      id: r[0], date: r[1] || '', indId: r[2] || '', value: parseFloat(r[3]) || 0, goal: parseFloat(r[4]) || 0, notes: r[5] || ''
    }));
  }

  async function syncAll() {
    setStatus('loading', 'Sincronizando...');
    try {
      await loadIndicators();
      await loadEntries();
      setStatus('ok', `${indicators.length} indicadores · ${entries.length} lançamentos`);
      const p = document.querySelector('.page.active').id.replace('page-', '');
      if (p === 'dashboard') renderDash();
      if (p === 'lancamento') renderLanc();
      if (p === 'indicadores') renderInds();
    } catch (e) {
      setStatus('err', 'Erro de conexão');
      showToast('Erro ao conectar: ' + e.message, 'err');
    }
  }

  function getStatus(value, goal, dir) {
    if (!goal || dir === 'none') return { label: '—', cls: 'b-neu' };
    const pct = value / goal;
    if (dir === 'up') {
      if (pct >= 0.9) return { label: 'Atingido', cls: 'b-ok' };
      if (pct >= 0.7) return { label: 'Parcial', cls: 'b-warn' };
      return { label: 'Abaixo', cls: 'b-bad' };
    } else {
      if (pct <= 1) return { label: 'OK', cls: 'b-ok' };
      if (pct <= 1.3) return { label: 'Atenção', cls: 'b-warn' };
      return { label: 'Acima', cls: 'b-bad' };
    }
  }

  function go(p) {
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.ni').forEach(el => el.classList.remove('active'));
    document.getElementById('page-' + p).classList.add('active');
    const titles = { dashboard: 'Dashboard', lancamento: 'Lançar dados', indicadores: 'Indicadores' };
    document.getElementById('page-title').textContent = titles[p];
    ['dashboard', 'lancamento', 'indicadores'].forEach((n, i) => {
      if (n === p) document.querySelectorAll('.ni')[i].classList.add('active');
    });
    if (p === 'dashboard') renderDash();
    if (p === 'lancamento') renderLanc();
    if (p === 'indicadores') renderInds();
  }

  function renderDash() {
    const dc = document.getElementById('dash-content');
    if (indicators.length === 0) {
      dc.innerHTML = `<div class="empty"><p>Nenhum indicador cadastrado ainda.<br>Vá em "Indicadores" para criar os seus.</p><button onclick="go('indicadores')">Criar indicadores →</button></div>`;
      if (lineChart) { lineChart.destroy(); lineChart = null; }
      if (barChart) { barChart.destroy(); barChart = null; }
      return;
    }
    const todayStr = today();
    const todayE = entries.filter(e => e.date === todayStr);

    const metricsHtml = indicators.map(ind => {
      const e = todayE.find(e => e.indId === ind.id);
      const val = e ? e.value : null;
      let sub = '<span class="neu">sem lançamento hoje</span>';
      if (e && e.goal) {
        const pct = Math.round(e.value / e.goal * 100);
        const st = getStatus(e.value, e.goal, ind.dir);
        const cls = st.cls === 'b-ok' ? 'up' : st.cls === 'b-bad' ? 'down' : 'neu';
        sub = `<span class="${cls}">${pct}% da meta</span>`;
      }
      return `<div class="mc">
        <div class="mc-label"><span class="dot-ind" style="background:${ind.color}"></span>${ind.name}</div>
        <div class="mc-val">${val !== null ? Number(val).toLocaleString('pt-BR') : '—'} <span class="mc-unit">${ind.unit}</span></div>
        <div class="mc-sub">${sub}</div>
      </div>`;
    }).join('');

    const hasE = entries.length > 0;
    const l7 = last7();
    const chartHtml = hasE ? `<div class="charts-row">
      <div class="cc"><div class="cc-title">Evolução — últimos 7 dias</div><div style="position:relative;height:160px;"><canvas id="lc"></canvas></div></div>
      <div class="cc"><div class="cc-title">Hoje vs meta</div><div style="position:relative;height:160px;"><canvas id="bc"></canvas></div></div>
    </div>` : '';

    const recent = [...entries].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10);
    const tableHtml = recent.length ? `<div class="htable">
      <div class="th-head"><span>Lançamentos recentes</span></div>
      <table><thead><tr><th>Data</th><th>Indicador</th><th>Valor</th><th>Meta</th><th>Status</th></tr></thead>
      <tbody>${recent.map(e => {
        const ind = indicators.find(i => i.id === e.indId);
        const st = getStatus(e.value, e.goal, ind?.dir || 'none');
        return `<tr>
          <td>${fmtD(e.date)}</td>
          <td><span style="display:inline-flex;align-items:center;gap:6px;"><span class="dot-ind" style="background:${ind?.color||'#888'}"></span>${ind?.name || '—'}</span></td>
          <td>${fmtVal(e.value, ind?.unit)}</td>
          <td>${e.goal ? fmtVal(e.goal, ind?.unit) : '—'}</td>
          <td><span class="badge ${st.cls}">${st.label}</span></td>
        </tr>`;
      }).join('')}</tbody></table></div>` : `<div style="padding:20px;text-align:center;font-size:12px;color:#888;">Nenhum lançamento ainda. <a href="#" onclick="go('lancamento');return false;" style="color:#1a1a1a;">Lançar agora →</a></div>`;

    dc.innerHTML = `<div class="metrics-grid">${metricsHtml}</div>${chartHtml}${tableHtml}`;

    if (hasE) {
      if (lineChart) lineChart.destroy();
      if (barChart) barChart.destroy();
      const lLabels = l7.map(ds => { const [,m,d] = ds.split('-'); return `${d}/${m}`; });
      lineChart = new Chart(document.getElementById('lc'), {
        type: 'line',
        data: { labels: lLabels, datasets: indicators.map(ind => ({
          label: ind.name,
          data: l7.map(ds => { const e = entries.find(e => e.date === ds && e.indId === ind.id); return e ? e.value : null; }),
          borderColor: ind.color, backgroundColor: ind.color + '22', tension: 0.4, pointRadius: 3, borderWidth: 2, spanGaps: true,
        })) },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { font: { size: 10 }, color: '#888' }, grid: { display: false } },
            y: { ticks: { font: { size: 10 }, color: '#888' }, grid: { color: 'rgba(0,0,0,0.05)' } }
          }
        }
      });
      const todayVals = indicators.map(ind => { const e = todayE.find(e => e.indId === ind.id); return e ? e.value : 0; });
      const goalVals  = indicators.map(ind => { const e = todayE.find(e => e.indId === ind.id); return e && e.goal ? e.goal : 0; });
      barChart = new Chart(document.getElementById('bc'), {
        type: 'bar',
        data: { labels: indicators.map(i => i.name), datasets: [
          { label: 'Realizado', data: todayVals, backgroundColor: indicators.map(i => i.color + 'cc'), borderRadius: 4 },
          { label: 'Meta', data: goalVals, backgroundColor: 'rgba(0,0,0,0.07)', borderRadius: 4 },
        ] },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { font: { size: 10 }, color: '#888' }, grid: { display: false } },
            y: { ticks: { font: { size: 10 }, color: '#888' }, grid: { color: 'rgba(0,0,0,0.05)' } }
          }
        }
      });
    }
  }

  function renderLanc() {
    if (indicators.length === 0) {
      document.getElementById('f-ind').innerHTML = '<option>— cadastre indicadores primeiro —</option>';
    } else {
      document.getElementById('f-ind').innerHTML = indicators.map(i => `<option value="${i.id}">${i.name} (${i.unit})</option>`).join('');
    }
    const recent = [...entries].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20);
    document.getElementById('entries-wrap').innerHTML = recent.length
      ? `<table><thead><tr><th>Data</th><th>Indicador</th><th>Valor</th><th>Meta</th><th>Status</th><th>Observações</th></tr></thead>
         <tbody>${recent.map(e => {
           const ind = indicators.find(i => i.id === e.indId);
           const st = getStatus(e.value, e.goal, ind?.dir || 'none');
           return `<tr>
             <td>${fmtD(e.date)}</td>
             <td>${ind?.name || '—'}</td>
             <td>${fmtVal(e.value, ind?.unit)}</td>
             <td>${e.goal ? fmtVal(e.goal, ind?.unit) : '—'}</td>
             <td><span class="badge ${st.cls}">${st.label}</span></td>
             <td style="color:#888;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${e.notes || ''}</td>
           </tr>`;
         }).join('')}</tbody></table>`
      : '<div style="padding:24px;text-align:center;font-size:12px;color:#888;">Nenhum lançamento ainda.</div>';
  }

  async function saveEntry() {
    if (indicators.length === 0) { showToast('Cadastre um indicador primeiro!', 'err'); return; }
    const date  = document.getElementById('f-date').value;
    const indId = document.getElementById('f-ind').value;
    const val   = parseFloat(document.getElementById('f-val').value);
    const goal  = parseFloat(document.getElementById('f-goal').value) || 0;
    const notes = document.getElementById('f-notes').value.trim();
    if (!date || isNaN(val)) { showToast('Preencha data e valor!', 'err'); return; }
    const btn = document.getElementById('btn-save');
    btn.disabled = true; btn.textContent = 'Salvando...';
    try {
      const id = Date.now().toString();
      await sheetsAppend('lancamentos', [id, date, indId, val, goal, notes]);
      entries.push({ id, date, indId, value: val, goal, notes });
      document.getElementById('f-val').value = '';
      document.getElementById('f-goal').value = '';
      document.getElementById('f-notes').value = '';
      setStatus('ok', `${indicators.length} indicadores · ${entries.length} lançamentos`);
      showToast('Lançamento salvo na planilha!', 'ok');
      renderLanc();
    } catch (e) {
      showToast('Erro ao salvar: ' + e.message, 'err');
      setStatus('err', 'Erro ao salvar');
    }
    btn.disabled = false; btn.textContent = 'Salvar lançamento';
  }

  function renderInds() {
    const list = document.getElementById('ind-list');
    if (indicators.length === 0) {
      list.innerHTML = '<div style="font-size:12px;color:#888;padding:4px 0 8px;">Nenhum indicador ainda. Adicione o primeiro abaixo!</div>';
      return;
    }
    list.innerHTML = indicators.map(ind => `
      <div class="ir">
        <div class="idot" style="background:${ind.color}"></div>
        <div class="iname">${ind.name}</div>
        <div class="iunit">${ind.unit}</div>
        <span class="badge b-neu" style="margin-right:8px;">${ind.dir==='up'?'↑ maior melhor':ind.dir==='down'?'↓ menor melhor':'neutro'}</span>
      </div>`).join('');
  }

  async function addInd() {
    const name  = document.getElementById('i-name').value.trim();
    const unit  = document.getElementById('i-unit').value.trim();
    const dir   = document.getElementById('i-dir').value;
    const color = document.getElementById('i-color').value;
    if (!name) { showToast('Informe o nome do indicador!', 'err'); return; }
    const btn = document.getElementById('btn-add-ind');
    btn.disabled = true; btn.textContent = 'Salvando...';
    try {
      const id = Date.now().toString();
      await sheetsAppend('indicadores', [id, name, unit || 'un', dir, color]);
      indicators.push({ id, name, unit: unit || 'un', dir, color });
      document.getElementById('i-name').value = '';
      document.getElementById('i-unit').value = '';
      setStatus('ok', `${indicators.length} indicadores · ${entries.length} lançamentos`);
      showToast(`"${name}" adicionado!`, 'ok');
      renderInds();
    } catch (e) {
      showToast('Erro: ' + e.message, 'err');
    }
    btn.disabled = false; btn.textContent = 'Adicionar indicador';
  }

  // Init
  const now = new Date();
  document.getElementById('sb-date').textContent = now.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
  document.getElementById('topbar-date').textContent = now.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
  document.getElementById('f-date').value = today();
  syncAll();
</script>
</body>
</html>
